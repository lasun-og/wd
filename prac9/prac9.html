<!--
9. Favorite Links Page
Create a webpage showing 3 of your favorite websites as hyperlinks. Each link should open in a new
tab. Use inline CSS for link colors (visited, hover).
Hint: <a href="url" target="_blank">. Use style="color: green;" inline.
-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Fav Websites</title>
</head>
<body>
    <h1>My 3 Fav Websites</h1>
    <a style="font-size: 50px; color: aqua;" onmouseout="this.style.color='red'" onmouseenter="this.style.color='lime'" target="_blank" href="https://github.com"> github</a>
    <br>
    <a style="font-size: 50px; color: aqua;" onmouseout="this.style.color='red'" onmouseover="this.style.color='lime'" target="_blank" href="https://google.com"> Google</a>
    <br>
    <a style="font-size: 50px; color: aqua;" onmouseout="this.style.color='red'" onmouseover="this.style.color='lime'" target="_blank" href="https://spotify.com"> spotify.com</a>
</body>
</html>
