<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Alert</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center mt-5">

    <!-- Q27: Bootstrap Alert Component
    Problem Statement:
    Create a page with a button. When clicked, show a Bootstrap success alert
    saying "Form submitted successfully!" (can be static for demonstration).
    -->

    <!-- Button -->
    <button class="btn btn-primary" onclick="showAlert()">
        Submit
    </button>

    <!-- Alert (Hidden Initially) -->
    <div id="msg" class="alert alert-success mt-3 d-none">
        Form submitted successfully!
    </div>

    <script>
        // Function to show alert
        function showAlert() {
            document.getElementById("msg").classList.remove("d-none");
        }
    </script>

</body>
</html>
