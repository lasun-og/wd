<!--
4. Simple Time Table
Create a college timetable for 3 days (Monday, Tuesday, Wednesday) with 3 periods per day.
Use HTML table with borders. Apply internal CSS for background color of days.
Hint: Use <table border="1">, <tr>, <th>, <td>. Use background-color in CSS.
-->

<!DOCTYPE html>
<html lang="en">
    <style>
        tr:nth-child(even){
            background-color: lime;
        }
    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: start; height: 100vh;" >
    <h1>
        College Time Table (3days)
    </h1>
    <table border="1px">

        <tr>
            <th>Days</th>
            <th>1st Period</th>
            <th>2nd Period</th>
            <th>3rd Period</th>
        </tr>
        <tr>
            <th style="background-color: tomato;">Monday</th>
            <td>DSA</td>
            <td>OOP</td>
            <td>WD</td>
        </tr>
        <tr>
            <th style="background-color: aqua;">Tuesday</th>
            <td>DM</td>
            <td>OOP</td>
            <td>IOT</td>
        </tr>
        <tr>
            <th style="background-color: limegreen;">Wednesday</th>
            <td>WD</td>
            <td>DSA</td>
            <td>DM</td>
        </tr>

    </table>
</body>
</html>
