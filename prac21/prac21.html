<!--
21. Show/Hide Paragraph
Create a paragraph and a button. On button click, hide the paragraph. If clicked again, show it again
(toggle).
Hint: Use display = "none" and display = "block". Check current style.
-->

<!DOCTYPE html>
<html lang="en">
    <script>
        function togglep() {

            let para = document.getElementById("paragraph");
            if (para.style.display == "block") {
                para.style.display = "none";
            }
            else {
                para.style.display = "block";
            }
        }
        

    </script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show and hide</title>
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
    <button onclick="togglep()">
        Toggle the paragraph
    </button>
    <p id="paragraph">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Doloribus corporis necessitatibus reiciendis assumenda doloremque repellendus ipsum cum nulla, deserunt dicta, officia itaque fuga quidem quos illum perspiciatis iure quisquam distinctio?</p>
</body>
</html>
