<!doctype html>
<html>
  <head>
    <title>Bootstrap Form</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Q26: Bootstrap Form with Basic Styling
    Problem Statement:
    Create a simple contact form (name, email, message) using Bootstrap form classes.
    Make it responsive and centered.
    -->

    <div class="container mt-5">
      <div class="row justify-content-center">
        <!-- Center Form -->
        <div class="col-md-6">
          <div class="card p-4">
            <h3 class="text-center">Contact Form</h3>

            <!-- Name -->
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                placeholder="Enter Name"
              />
            </div>

            <!-- Email -->
            <div class="mb-3">
              <input
                type="email"
                class="form-control"
                placeholder="Enter Email"
              />
            </div>

            <!-- Message -->
            <div class="mb-3">
              <textarea
                class="form-control"
                placeholder="Enter Message"
              ></textarea>
            </div>

            <!-- Button -->
            <button class="btn btn-primary w-100">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
