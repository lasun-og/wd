<!--
11. Simple College Brochure
Design a small brochure with college name, image of campus, and a paragraph about the college.
Use external CSS for all styling.

Hint: Create style.css file. Link using <link rel="stylesheet" href="style.css">.
-->

<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="./style.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Brochure</title>
</head>

<body>

    <div class="brochure">

        <h1>MET BKC Institute of Engineering</h1>

        <img src="./college.jpg" width="400px" alt="College Campus">

        <p>
            MET BKC Institute of Engineering is a well known college
            offering quality education in engineering and technology.
        </p>

    </div>

</body>
</html>
