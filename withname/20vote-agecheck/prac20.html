<!--
20. Simple Age Check
Create an HTML form with age input and submit button. Use JavaScript to check if age ≥ 18. Show 
"Eligible to vote" or "Not eligible".

Hint: Use onclick or onsubmit. Compare using if(age >= 18).
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Check</title>
</head>

<body align="center">

    <h1>Simple Age Check</h1>

    <form>

        Enter Age :
        <input type="number" id="age">
        <br><br>

        <button type="button" onclick="checkAge()">
            Submit
        </button>

    </form>

    <h2 id="result"></h2>

</body>

<!-- JS Start -->
<script>

    function checkAge(){

        let age = document.getElementById("age").value;

        if(age >= 18){
            document.getElementById("result").innerHTML =
            "Eligible to Vote";
        }

        else{
            document.getElementById("result").innerHTML =
            "Not Eligible";
        }
    }

</script>
<!-- JS End -->

</html>
