<!--
12. Hobby Page with Text Formatting
Create a page titled "My Hobbies". Use text formatting tags like <strong>, <em>, <mark>, and <del>.
Apply inline CSS for background.

Hint: <mark> highlights text, <del> strikes through.
Use style="background: lightyellow;".
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobbies</title>
</head>

<body align="center" style="background: lightyellow;">

    <h1>My Hobbies</h1>

    <p>
        I like <strong>Playing Games</strong>,
        <em>Coding</em> and
        <mark>Gym Workout</mark>.
    </p>

    <p>
        I <del>do not like wasting time</del>
    </p>

</body>
</html>
