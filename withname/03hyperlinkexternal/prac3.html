<!--
3. Image with Caption and Link
Create a page showing your favorite animal image. Below image, add a hyperlink that says "Click
here to know more". Use external CSS for image border and link color.
Hint: Use <img src="..." width="200">. Link using <a href="#">. External CSS file with .css extension.
-->




<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="./style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image with Caption</title>
</head>
<body>
    <img src="./polish_cow.png" width="600px" class="cow" alt="polish_cow">
    <h1>My favorite animal is a cow</h1>
    <a href="https://google.com/search?q=cows" target="_blank" title="know more about cows">Click here to know more</a>
</body>
</html>
