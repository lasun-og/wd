<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Buttons</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-center mt-5">

    <!-- Q25: Bootstrap Button Styling
    Problem Statement:
    Create 3 buttons: Primary, Success, Danger using Bootstrap classes.
    On clicking any button, show an alert "Button clicked" using JavaScript.
    -->

    <!-- Buttons -->
    <button class="btn btn-primary" onclick="msg()">Primary</button>
    <button class="btn btn-success" onclick="msg()">Success</button>
    <button class="btn btn-danger" onclick="msg()">Danger</button>

    <script>
        // Function for alert
        function msg() {
            alert("Button clicked");
        }
    </script>

</body>
</html>
