<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Grid Layout</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Q24: Bootstrap Grid Layout (2 Columns)
    Problem Statement:
    Create a webpage with 2 equal columns using Bootstrap Grid.
    Left column shows text "About Me", right column shows "My Skills".
    Use cards inside.
    -->

    <div class="container mt-4">
        <div class="row">

            <!-- Left Column -->
            <div class="col-md-6">
                <div class="card p-3">
                    <h3>About Me</h3>
                    <p>I am a student learning web development.</p>
                </div>
            </div>

            <!-- Right Column -->
            <div class="col-md-6">
                <div class="card p-3">
                    <h3>My Skills</h3>
                    <p>HTML, CSS, JavaScript, Bootstrap</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
